# XcodeGen spec for the iOS app shell. Written on Windows; the .xcodeproj is generated on the cloud Mac
# (GitHub Actions) with `xcodegen generate` and is never committed.
name: Probe
options:
  bundleIdPrefix: dev.probe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Only the arm64 simulator slice of the shared framework is built.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Probe:
    build:
      targets:
        Probe: all
    run:
      config: Debug
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The single asset folder shared with the desktop preview (fonts, later voice clips and data files).
      - path: ../bundle/assets
        type: folder
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: "Records the test route while the probe runs."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Records the test route while the probe runs."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.probe.kmp
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator builds are signed ad hoc (no Apple account); device/TestFlight signing is added in CI later.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          # System libraries MapLibre Native needs (maplibre-compose links no framework of its own).
          - -lc++
          - -lz
          - -framework
          - CoreFoundation
          - -framework
          - CoreGraphics
          - -framework
          - CoreText
          - -framework
          - Foundation
          - -framework
          - ImageIO
          - -framework
          - Metal
          - -framework
          - QuartzCore
    preBuildScripts:
      # Builds the shared Kotlin framework for exactly the SDK/architecture Xcode is building.
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
